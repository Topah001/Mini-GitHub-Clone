<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Pantry — Mini GitHub</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>▱ code pantry <small>/ tiny repo host</small></h1><form id="auth"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (8+ chars)" required><button name="action" value="login">Sign in</button><button name="action" value="register">Join</button></form><span id="identity"></span></header><main><section class="hero"><small>A TINY REPOSITORY BROWSER</small><h2>Your code, organized<br>and easy to browse.</h2><p>Create repositories, add safe text files, and browse source locally.</p></section><div class="layout"><aside><h2>Repositories <button id="new">＋ New</button></h2><div id="repos"></div><form id="create" hidden><input name="name" placeholder="repository-name" required maxlength="39"><input name="description" placeholder="Short description" maxlength="300"><button>Create repository</button></form></aside><section class="viewer"><div id="welcome">Choose a repository, or create one.</div><div id="repo-view" hidden><h2 id="repo-name"></h2><p id="repo-description"></p><div class="source-layout"><nav id="files"></nav><article class="source"><div class="bar"><span id="filename">Select a file</span><button id="add-file">＋ Add text file</button></div><form id="upload" hidden><input name="path" placeholder="src/example.py" required maxlength="180"><textarea name="content" placeholder="Paste text or source code…" maxlength="50000" required></textarea><button>Save file</button></form><pre id="content"></pre></article></div></div></section></div></main><footer>SQLite storage · Safe text-only file contents</footer><script src="/app.js" defer></script></body></html>
